name: mtrust_sec_kit
description: A comprehensive SDK for interfacing with the MTrust SEC Readers.
  Including an example to get you started as fast as possible.
version: 3.0.0-0
repository: https://github.com/emdgroup/mtrust-sec-kit
environment:
  sdk: ">=3.2.5 <4.0.0"
  flutter: ">=1.17.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  liquid_flutter: ^22.0.4
  mtrust_urp_core: ^9.1.0-9
  mtrust_urp_types: ^6.2.0
  mtrust_urp_ui: ^9.1.0-9
dev_dependencies:
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mtrust_urp_virtual_strategy: ^9.1.0-9
  very_good_analysis: ^5.1.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
