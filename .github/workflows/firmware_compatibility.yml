name: Firmware Compatibility Check

on:
    pull_request:
        branches:
            - main
            - dev

jobs:
  fetch-firmware-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-output.outputs.versions }}
    steps:
      - name: Fetch firmware tags
        run: |
          git clone --quiet --depth=1 --filter=blob:none --no-checkout https://github.com/merckgroup/mtrust-device-sim.git
          cd repo
          git fetch --tags --quiet
          tags=$(git tag -l | jq -R . | jq -s .)
          echo "Available firmware versions: $tags"
          echo "versions=$tags" >> $GITHUB_OUTPUT
        id: set-output

  fetch-sdk-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-output.outputs.versions }}
    steps:
      - name: Fetch SDK tags
        run: |
          git clone --quiet --depth=1 --filter=blob:none --no-checkout https://github.com/emdgroup/mtrust-sec-kit.git
          cd repo
          git fetch --tags --quiet
          tags=$(git tag -l | jq -R . | jq -s .)
          echo "Available SDK versions: $tags"
          echo "versions=$tags" >> $GITHUB_OUTPUT
        id: set-output

  test-compatibility:
    needs: [fetch-firmware-versions, fetch-sdk-versions]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware_version: ${{ fromJson(needs.fetch-firmware-versions.outputs.versions) }}
        sdk_version: ${{ fromJson(needs.fetch-sdk-versions.outputs.versions) }}
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: emdgroup/mtrust-imp-kit
          ref: ${{ matrix.sdk_version }}
          path: sdk

      - name: Start device sim
        uses: merckgroup/mtrust-device-sim/.github/actions/start-urp-sim@dev
        id: urp-sim
        with:
          repository: "mtrust-urp-os"
          tag: ${{ matrix.firmware_version }}
          environment: "d"
          token: "***"

      - name: Default tests for device sim
        uses: merckgroup/mtrust-device-sim/.github/actions/test-urp-sim@dev

      - name: Validate SDK
        uses: emdgroup/mtrust-urp/.github/shared_actions/validate-flutter@dev
        with:
          directory: sdk
          is_package: true
          api_url: "https://api.dev.mtrust.io"

      - name: Mark compatibility as passed
        if: success()
        run: |
          mkdir -p result
          echo '{"firmware": "${{ matrix.firmware_version }}", "sdk": "${{ matrix.sdk_version }}"}' > result/compat.json
        shell: bash

      - name: Upload result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.firmware_version }}-${{ matrix.sdk_version }}
          path: result/compat.json

      - name: Stop device sim
        uses: merckgroup/mtrust-device-sim/.github/actions/stop-urp-sim@dev
        with:
          websocket_pid: ${{ steps.urp-sim.outputs.websocket_pid }}
          pio_pid: ${{ steps.urp-sim.outputs.pio_pid }}

  generate-matrix:
    needs: test-compatibility
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all compatibility artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate SDK to firmware compatibility map
        run: |
          mkdir -p assets
          tmpfile=$(mktemp)

          echo '{}' > $tmpfile

          # Extract and group firmware versions per SDK
          find all-results -name compat.json | while read file; do
            sdk=$(jq -r .sdk "$file")
            fw=$(jq -r .firmware "$file")

            # Remove leading 'v' if present to get plain semver
            sdk=${sdk#v}
            fw=${fw#v}

            # Add firmware version to SDK list
            tmp=$(mktemp)
            jq --arg sdk "$sdk" --arg fw "$fw" '
              .[$sdk] += [$fw] // {($sdk): [$fw]}
            ' "$tmpfile" > "$tmp" && mv "$tmp" "$tmpfile"
          done

          # Convert lists to semver ranges
          jq 'to_entries | 
              map({
                key: .key,
                value: (
                  .value | sort_by(split(".") | map(tonumber)) |
                  "\(.[0]) - \(.[-1])"
                )
              }) | from_entries' "$tmpfile" > assets/firmware_compatibility.json

      - name: Show generated matrix
        run: cat assets/firmware_compatibility.json

      - name: Upload full matrix
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-matrix
          path: assets/firmware_compatibility.json
