name: Fetch SDK Versions
description: Clones the SDK repo and extracts available tags.
outputs:
  versions:
    description: JSON array of SDK tags
    value: ${{ steps.set-output.outputs.versions }}
runs:
  using: "composite"
  steps:
    - name: Fetch SDK tags via REST
      id: set-output
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.ELEVATED_TOKEN }}
      run: |
        REPO=emdgroup/mtrust-sec-kit
        tags=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/tags?per_page=100" | jq -r '.[].name')
        tags_json=$(echo "$tags" | jq -R . | jq -s .)
        echo "Available SDK versions: $tags_json"
        echo "versions=$tags_json" >> $GITHUB_OUTPUT
