name: Fetch Firmware Versions
description: Clones the firmware repo and extracts available tags.
outputs:
  versions:
    description: JSON array of firmware tags
    value: ${{ steps.set-output.outputs.versions }}
runs:
  using: "composite"
  steps:
    - name: Fetch firmware tags via REST
      id: set-output
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.ELEVATED_TOKEN }}
      run: |
        REPO=merckgroup/mtrust-device-sim
        tags=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/tags?per_page=100" | jq -r '.[].name')
        tags_json=$(echo "$tags" | jq -R . | jq -s .)
        echo "Available firmware versions: $tags_json"
        echo "versions=$tags_json" >> $GITHUB_OUTPUT
        